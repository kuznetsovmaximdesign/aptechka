<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏥 Аптечка</title>
<style>
  :root {
    --tg-bg: #ffffff; --tg-secondary-bg: #f4f4f5; --tg-text: #000000;
    --tg-hint: #8e8e93; --tg-link: #007aff;
    --box1: #007aff; --box2: #34c759; --box3: #af52de; --boxf: #5ac8fa;
    --rx: #ff9500; --expire-warn: #ff3b30; --out: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root { --tg-bg: #1c1c1e; --tg-secondary-bg: #2c2c2e; --tg-text: #ffffff; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--tg-bg); color: var(--tg-text); font-size: 15px; overscroll-behavior: none; min-height: 100vh; }
  .header { position: sticky; top: 0; z-index: 100; background: var(--tg-bg); border-bottom: 0.5px solid rgba(128,128,128,0.2); padding: 0 16px; }
  .header-row { display: flex; align-items: center; height: 48px; gap: 10px; }
  .header-title { flex: 1; font-size: 17px; font-weight: 600; }
  .search-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--tg-secondary-bg); cursor: pointer; color: var(--tg-link); flex-shrink: 0; }
  .search-bar { display: none; padding: 8px 0; }
  .search-bar.open { display: block; }
  .search-input { width: 100%; background: var(--tg-secondary-bg); border: none; outline: none; border-radius: 10px; padding: 9px 12px; font-size: 15px; color: var(--tg-text); font-family: inherit; }
  .search-input::placeholder { color: var(--tg-hint); }
  .back-btn { display: none; align-items: center; gap: 4px; color: var(--tg-link); cursor: pointer; font-size: 17px; flex-shrink: 0; }
  .back-btn.visible { display: flex; }
  .symptoms-screen { padding: 12px 16px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--tg-hint); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
  .symptoms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .symptom-card { background: var(--tg-secondary-bg); border-radius: 12px; padding: 14px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex; align-items: center; gap: 10px; user-select: none; }
  .symptom-card:active { opacity: 0.6; transform: scale(0.97); }
  .symptom-emoji { font-size: 22px; flex-shrink: 0; }
  .symptom-label { font-size: 14px; font-weight: 500; line-height: 1.2; }
  .medicines-screen { display: none; padding-bottom: 40px; }
  .medicines-screen.visible { display: block; }
  .symptoms-screen.hidden { display: none; }
  .search-screen { display: none; padding-bottom: 40px; }
  .search-screen.visible { display: block; }
  .group-header { padding: 20px 16px 6px; font-size: 13px; font-weight: 600; color: var(--tg-hint); text-transform: uppercase; letter-spacing: 0.4px; }
  .medicine-list { padding: 0 16px; }
  .med-card { background: var(--tg-secondary-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: opacity 0.15s; }
  .med-card:active { opacity: 0.7; }
  .med-card.out-of-stock { opacity: 0.45; }
  .med-card.out-of-stock .med-name { text-decoration: line-through; color: var(--tg-hint); }
  .med-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .med-name { font-size: 15px; font-weight: 600; line-height: 1.3; flex: 1; }
  .badges { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .badge-box1 { background: var(--box1); } .badge-box2 { background: var(--box2); } .badge-box3 { background: var(--box3); }
  .badge-boxf { background: var(--boxf); color: #000; } .badge-rx { background: var(--rx); }
  .badge-expire { background: var(--expire-warn); } .badge-out { background: var(--out); }
  .med-qty { font-size: 13px; color: var(--tg-hint); margin-bottom: 4px; }
  .med-usage { font-size: 13px; color: var(--tg-hint); line-height: 1.4; }
  .detail-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); }
  .detail-overlay.open { display: block; }
  .detail-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--tg-bg); border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px 20px 40px; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-handle { width: 36px; height: 4px; background: var(--tg-hint); opacity: 0.4; border-radius: 2px; margin: 0 auto 16px; }
  .detail-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .detail-substance { font-size: 14px; color: var(--tg-hint); margin-bottom: 14px; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .detail-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid rgba(128,128,128,0.15); }
  .detail-label { font-size: 13px; color: var(--tg-hint); min-width: 80px; flex-shrink: 0; }
  .detail-value { font-size: 14px; line-height: 1.4; }
  .out-btn { width: 100%; margin-top: 20px; padding: 14px; background: var(--expire-warn); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .out-btn.restore { background: var(--box2); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--tg-hint); font-size: 15px; }
  .empty-emoji { font-size: 48px; margin-bottom: 12px; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 4px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--tg-hint); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <div class="back-btn" id="backBtn" onclick="goBack()">
      <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 1L1 9l8 8"/></svg>
      Назад
    </div>
    <div class="header-title" id="headerTitle">🏥 Аптечка</div>
    <div class="search-icon" onclick="toggleSearch()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="search" class="search-input" id="searchInput" placeholder="Препарат или симптом…" oninput="handleSearch(this.value)" autocomplete="off">
  </div>
</div>

<div class="symptoms-screen" id="symptomsScreen">
  <div class="section-title">Выбери симптом</div>
  <div class="symptoms-grid" id="symptomsGrid"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--box1)"></div> К1 острое</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--box2)"></div> К2 простуда</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--box3)"></div> К3 хроническое</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--boxf)"></div> Холодильник</div>
  </div>
</div>

<div class="medicines-screen" id="medicinesScreen"></div>
<div class="search-screen" id="searchScreen"></div>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetailOutside(event)">
  <div class="detail-sheet"><div class="detail-handle"></div><div id="detailContent"></div></div>
</div>

<script>
const API = 'https://aptechka.kuznetsovs.netcraze.link';
let MEDICINES = [];

const SYMPTOMS = [
  {key:'head',emoji:'🤕',label:'Головная боль'},{key:'fever',emoji:'🌡️',label:'Температура'},
  {key:'nose',emoji:'🤧',label:'Насморк'},{key:'throat',emoji:'😮',label:'Горло'},
  {key:'cold',emoji:'🤒',label:'Простуда / ОРВИ'},{key:'allergy',emoji:'🌸',label:'Аллергия'},
  {key:'hangover',emoji:'🥴',label:'Похмелье / отравление'},{key:'gut',emoji:'🫄',label:'Живот и ЖКТ'},
  {key:'pain',emoji:'💪',label:'Мышцы и суставы'},{key:'wound',emoji:'🩹',label:'Раны / антисептика'},
  {key:'teeth',emoji:'🦷',label:'Зубная боль'},{key:'eyes',emoji:'👁️',label:'Глаза и уши'},
  {key:'skin',emoji:'🧴',label:'Кожа / грибок'},{key:'heart',emoji:'❤️',label:'Сердце и давление'},
  {key:'sleep',emoji:'😴',label:'Сон'},{key:'emergency',emoji:'🚨',label:'Экстренное'},
];

const FALLBACK = [
  {"n":"Парацетамол 500мг","b":1,"a":"Парацетамол","c":"Обезболивающее","q":"3 пачки","e":"11/2030","rx":0,"t":["head","fever","cold","hangover"],"u":"1 таб. 3–4 р/день после еды."},
  {"n":"Нурофен (ибупрофен 400мг)","b":1,"a":"Ибупрофен","c":"Обезболивающее","q":"15 капс.","e":"12/2028","rx":0,"t":["head","fever","pain","teeth","cold","hangover"],"u":"1 капс. 3 р/день после еды."},
  {"n":"Мирамистин спрей","b":1,"a":"Мирамистин","c":"Антисептик","q":"50 мл","e":"09/2028","rx":0,"t":["wound","throat","skin"],"u":"Рана: 3–4 нажатия. Горло: 4 нажатия 3–4 р/день."},
  {"n":"Активированный уголь","b":1,"a":"Активированный уголь","c":"Сорбент","q":"50 таб.","e":"09/2029","rx":0,"t":["gut","hangover"],"u":"1 таб. на 10 кг веса."},
  {"n":"Цетрин 10мг","b":2,"a":"Цетиризин","c":"Аллергия","q":"17 таб.","e":"02/2027","rx":0,"t":["allergy","nose"],"u":"1 таб. 1 р/день вечером."},
  {"n":"Омепразол","b":3,"a":"Омепразол","c":"ЖКТ — кислотность","q":"30 капс.","e":"04/2027","rx":0,"t":["gut","hangover"],"u":"1 капс. утром до еды."},
];

async function loadMedicines() {
  // Показываем кэш сразу
  const cached = localStorage.getItem('aptechka_medicines');
  if (cached) {
    try {
      MEDICINES = JSON.parse(cached);
      renderSymptoms();
    } catch(e) {}
  }
  // Обновляем в фоне
  try {
    const r = await fetch(API+'/medicines', {mode:'cors'});
    const d = await r.json();
    if (d.length) {
      MEDICINES = d;
      localStorage.setItem('aptechka_medicines', JSON.stringify(d));
      renderSymptoms();
    }
  } catch(e) {
    if (!MEDICINES.length) { MEDICINES = FALLBACK; renderSymptoms(); }
  }
}

async function saveMedicines() {
  try {
    await fetch(API+'/medicines', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(MEDICINES), mode:'cors'});
  } catch(e) {}
}

const isExpired = e => { if(!e) return false; const [m,y]=e.split('/').map(Number); return new Date(y,m)<new Date(); };
const isExpiringSoon = e => { if(!e) return false; const [m,y]=e.split('/').map(Number); return (new Date(y,m-1)-new Date())/(1000*60*60*24*30)<3; };

function boxBadge(b) {
  return ({1:`<span class="badge badge-box1">К1</span>`,2:`<span class="badge badge-box2">К2</span>`,3:`<span class="badge badge-box3">К3</span>`,f:`<span class="badge badge-boxf">❄️</span>`})[b]||'';
}

function medCardHTML(med, idx) {
  const out = med.out_of_stock;
  let badges = boxBadge(med.b);
  if (med.rx) badges += `<span class="badge badge-rx">Rx</span>`;
  if (out) badges += `<span class="badge badge-out">Нет</span>`;
  else if (isExpired(med.e)) badges += `<span class="badge badge-expire">Просрочен</span>`;
  else if (isExpiringSoon(med.e)) badges += `<span class="badge badge-expire">Скоро</span>`;
  return `<div class="med-card${out?' out-of-stock':''}" onclick="openDetail(${idx})">
    <div class="med-row1"><div class="med-name">${med.n}</div><div class="badges">${badges}</div></div>
    <div class="med-qty">${out?'❌ Нет в наличии':(med.q?'📦 '+med.q:'')}</div>
    <div class="med-usage">${med.u}</div>
  </div>`;
}

function renderSymptoms() {
  document.getElementById('symptomsGrid').innerHTML = SYMPTOMS.map(s =>
    `<div class="symptom-card" onclick="showSymptom('${s.key}','${s.emoji} ${s.label}')"><span class="symptom-emoji">${s.emoji}</span><span class="symptom-label">${s.label}</span></div>`
  ).join('');
}

let currentSymKey='', currentSymLabel='';
function showSymptom(key, label) {
  currentSymKey=key; currentSymLabel=label;
  const meds = MEDICINES.map((m,i)=>({...m,_idx:i})).filter(m=>m.t.includes(key));
  if (!meds.length) return;
  const groups = {};
  meds.forEach(m => { if(!groups[m.a]) groups[m.a]=[]; groups[m.a].push(m); });
  let html='';
  Object.entries(groups).forEach(([s,items])=>{ html+=`<div class="group-header">${s}</div><div class="medicine-list">${items.map(m=>medCardHTML(m,m._idx)).join('')}</div>`; });
  document.getElementById('medicinesScreen').innerHTML=html;
  document.getElementById('medicinesScreen').classList.add('visible');
  document.getElementById('symptomsScreen').classList.add('hidden');
  document.getElementById('headerTitle').textContent=label;
  document.getElementById('backBtn').classList.add('visible');
}

function goBack() {
  document.getElementById('medicinesScreen').classList.remove('visible');
  document.getElementById('symptomsScreen').classList.remove('hidden');
  document.getElementById('headerTitle').textContent='🏥 Аптечка';
  document.getElementById('backBtn').classList.remove('visible');
  closeSearch();
}

let searchOpen=false;
function toggleSearch() {
  searchOpen=!searchOpen;
  if (searchOpen) {
    document.getElementById('searchBar').classList.add('open');
    document.getElementById('searchInput').focus();
    document.getElementById('symptomsScreen').classList.add('hidden');
    document.getElementById('medicinesScreen').classList.remove('visible');
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('headerTitle').textContent='Поиск';
    document.getElementById('searchScreen').classList.add('visible');
    renderSearchResults('');
  } else closeSearch();
}
function closeSearch() {
  searchOpen=false;
  document.getElementById('searchBar').classList.remove('open');
  document.getElementById('searchScreen').classList.remove('visible');
  document.getElementById('symptomsScreen').classList.remove('hidden');
  document.getElementById('headerTitle').textContent='🏥 Аптечка';
  document.getElementById('searchInput').value='';
}
function handleSearch(q) { renderSearchResults(q); }
function renderSearchResults(q) {
  const screen=document.getElementById('searchScreen');
  if (!q.trim()) { screen.innerHTML=`<div class="empty-state"><div class="empty-emoji">🔍</div>Введи название препарата<br>или симптом</div>`; return; }
  const ql=q.toLowerCase();
  const r=MEDICINES.map((m,i)=>({...m,_idx:i})).filter(m=>m.n.toLowerCase().includes(ql)||m.a.toLowerCase().includes(ql)||m.c.toLowerCase().includes(ql));
  screen.innerHTML = r.length ? `<div class="medicine-list" style="padding-top:8px">${r.map(m=>medCardHTML(m,m._idx)).join('')}</div>` : `<div class="empty-state"><div class="empty-emoji">😕</div>Ничего не найдено</div>`;
}

function openDetail(idx) {
  const med=MEDICINES[idx]; if(!med) return;
  const out=med.out_of_stock;
  let badges=boxBadge(med.b);
  if(med.rx) badges+=`<span class="badge badge-rx">Rx — рецептурный</span>`;
  const expColor=isExpired(med.e)?'var(--expire-warn)':isExpiringSoon(med.e)?'var(--rx)':'inherit';
  const expLabel=isExpired(med.e)?'⚠️ Просрочен!':isExpiringSoon(med.e)?'⏰ Скоро':med.e||'—';
  const boxL={1:'Коробка 1 — острое',2:'Коробка 2 — простуда',3:'Коробка 3 — хроническое',f:'❄️ Холодильник'};
  const symL=(med.t||[]).map(k=>(SYMPTOMS.find(s=>s.key===k)||{}).label).filter(Boolean).join(', ');
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-name">${med.n}</div>
    <div class="detail-substance">${med.a}</div>
    <div class="detail-badges">${badges}</div>
    <div class="detail-row"><span class="detail-label">Расположение</span><span class="detail-value">${boxL[med.b]||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Количество</span><span class="detail-value" style="${out?'color:var(--out);text-decoration:line-through':''}">${med.q||'—'}${out?' — нет в наличии':''}</span></div>
    <div class="detail-row"><span class="detail-label">Срок годности</span><span class="detail-value" style="color:${expColor}">${expLabel}</span></div>
    <div class="detail-row"><span class="detail-label">Категория</span><span class="detail-value">${med.c}</span></div>
    ${symL?`<div class="detail-row"><span class="detail-label">Симптомы</span><span class="detail-value">${symL}</span></div>`:''}
    <div class="detail-row" style="border:none"><span class="detail-label">Применение</span><span class="detail-value">${med.u}</span></div>
    <button class="out-btn${out?' restore':''}" onclick="toggleOutOfStock(${idx})">${out?'✅ Снова в наличии':'❌ Закончилось'}</button>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}

async function toggleOutOfStock(idx) {
  MEDICINES[idx].out_of_stock = !MEDICINES[idx].out_of_stock;
  await saveMedicines();
  document.getElementById('detailOverlay').classList.remove('open');
  if (searchOpen) renderSearchResults(document.getElementById('searchInput').value);
  else if (currentSymKey) showSymptom(currentSymKey, currentSymLabel);
}

function closeDetailOutside(e) {
  if(e.target===document.getElementById('detailOverlay')) document.getElementById('detailOverlay').classList.remove('open');
}

if(window.Telegram?.WebApp){
  const tg=window.Telegram.WebApp; tg.ready();
  if(tg.colorScheme==='dark'){
    document.documentElement.style.setProperty('--tg-bg',tg.themeParams.bg_color||'#1c1c1e');
    document.documentElement.style.setProperty('--tg-secondary-bg',tg.themeParams.secondary_bg_color||'#2c2c2e');
    document.documentElement.style.setProperty('--tg-text',tg.themeParams.text_color||'#ffffff');
    document.documentElement.style.setProperty('--tg-hint',tg.themeParams.hint_color||'#8e8e93');
    document.documentElement.style.setProperty('--tg-link',tg.themeParams.link_color||'#5ac8fa');
  }
  tg.BackButton.onClick(()=>{
    if(document.getElementById('detailOverlay').classList.contains('open')) document.getElementById('detailOverlay').classList.remove('open');
    else if(searchOpen) closeSearch();
    else if(document.getElementById('medicinesScreen').classList.contains('visible')) goBack();
  });
}

loadMedicines();
</script>
</body>
</html>
